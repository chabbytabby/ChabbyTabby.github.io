<!DOCTYPE html>
<html>
<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMISSION_QUEUE.EXE</title>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
   <style>
    body { 
        background: #ff66b2;  
        margin: 0; 
        font-family: 'Tahoma', sans-serif; 
        height: 100vh; 
        display: flex; 
        align-items: center; 
        justify-content: center;
    }

    .win-container {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #fff #808080 #808080 #fff;
        width: 900px;  
        height: 600px;
        position: relative;
        padding: 2px;
        display: flex;
        flex-direction: column;  
        resize: both;  
        overflow: hidden;  
        min-width: 400px;
        min-height: 300px;
    }

    .win-titlebar {
        background: linear-gradient(to right, #000080, #1084d0);
        padding: 3px 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
        font-weight: bold;
        font-size: 0.8rem;
        cursor: move;
        flex-shrink: 0;  
    }

    .win-content {
        padding: 2px;
        background: #fff;
        flex-grow: 1;  
        border: 2px inset #808080;
        overflow: hidden;
    }

    iframe { width: 100%; height: 100%; border: none; }
     
@media screen and (max-width: 600px) {
    .win-container {
        width: 95vw !important;  
        height: 80vh !important;  
        left: 0;
        top: 0;
        margin: 0 auto;
    }
    
    .win-titlebar {
        font-size: 0.7rem;
    }

    .pop-out-btn {
        padding: 2px 8px;  
    }
}
</style>
</head>
<body>

    <div class="win-container" id="queue-window">
        <div class="win-titlebar" id="drag-handle">
            <span>COMMISSION_QUEUE.EXE</span>
            <div style="display: flex; gap: 4px;">
                <a href="/" style="color: white; text-decoration: none; border: 1px solid white; padding: 0 4px; font-size: 0.7rem;">[BACK_TO_SITE]</a>
            </div>
        </div>
        <div class="win-content">
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS8Ax4A2yS3gBxgQ_oFhvWdOCgOo8E7bXO-0hWQ2wDGvJX3sIDSrAivDto1LyXh86nLpWny2gDsLiUA/pubhtml?widget=true&headers=false"></iframe>
        </div>
    </div>

    <script>
        interact('#queue-window').draggable({
            allowFrom: '#drag-handle',
            listeners: { move(event) {
                const target = event.target;
                const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
                target.style.transform = `translate(${x}px, ${y}px)`;
                target.setAttribute('data-x', x);
                target.setAttribute('data-y', y);
            }}
        });
    </script>
</body>
</html>
