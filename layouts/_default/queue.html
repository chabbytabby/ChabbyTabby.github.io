{{ define "main" }}
<style>
    .queue-container {
        background: #111;
        border: 2px solid var(--hot-pink);
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        min-height: 600px;
    }
    .queue-header {
        color: var(--neon-yellow);
        font-size: 1.8rem;
        text-transform: uppercase;
        margin-bottom: 20px;

    }
    .spreadsheet-wrapper {

        height: 700px;

        overflow: hidden;

    iframe {

        height: 100%;
