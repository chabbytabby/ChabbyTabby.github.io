{{ define "main" }}
<style>
    /* Specific styles just for the homepage layout */
    
    /* --- TOP ART BANNER WITH KITTY OVERLAYS --- */
    .top-art-banner {
        border: 4px solid var(--hot-pink, #ff007f); /* Added hex fallbacks just in case! */
        border-radius: var(--inner-radius, 12px);
        overflow: hidden;
        margin-bottom: 25px;
        background: #000;
        position: relative;
        padding-top: 15px;
        padding-bottom: 15px;
    }

    .kitty-bar-overlay {
        position: absolute;
        left: 0;
        width: 100%;
        height: auto;
        display: block;
        z-index: 10;
    }
    
    .kitty-bar-top { top: -2px; }
    .kitty-bar-bottom { bottom: -2px; }

    /* --- THE LAYERED STICKER BLOCK --- */
    .layered-sticker-block {
        display: block;
        text-decoration: none;
        margin-bottom: 35px;
        position: relative;
        border: none;
        background: transparent;
        padding: 0;
        box-shadow: none;
    }
    
    /* NEW: Enhanced 3D Hover Effect for Stickers */
    .layered-sticker-block:hover .layered-base-img {
        filter: brightness(1.1) drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
    }
    .layered-sticker-block:hover .layered-welcome {
        transform: rotate(-5deg) scale(1.05); /* Tilts up and grows */
        filter: drop-shadow(5px 5px 0px #000); /* Shadow drops further away */
    }
    .layered-sticker-block:hover .layered-enter {
        transform: translateX(-50%) translateY(-5px) scale(1.05); /* Bumps up */
    }

    .layered-image-container {
        position: relative;
        width: 100%;
        text-align: center;
        padding-top: 0; 
        padding-bottom: 0;
    }

    .layered-base-img {
        width: 100%;
        max-width: 600px;
        border-radius: 8px;
        border: 2px solid #333;
        display: inline-block;
        transition: all 0.3s ease;
    }

    .layered-welcome {
        position: absolute;
        top: -20px; 
        left: -5%;
        max-width: 40%;
        transform: rotate(-12deg); /* FIX: Added the missing angle number */
        z-index: 20; 
        filter: drop-shadow(3px 3px 0px #000);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); /* Smooth snap */
    }

    .layered-label {
        position: absolute;
        top: -12%;
        left: -8%;
        width: 50%;
        max-width: 320px;
        z-index: 15;           
        border-radius: 18px; 
        box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.6), inset 0 0 8px rgba(255,255,255,0.3);
        border: 1px solid #333; 
        background: #000000;
        padding: 4px;
        transform: rotate(-8deg);   
    }

    .layered-enter {
        position: absolute;
        bottom: -5px; /* FIX: Moved slightly so it anchors nicely */
        left: 50%;
        transform: translateX(-50%); 
        max-width: 60%; /* FIX: Prevent mobile overflow */
        min-width: 150px; /* Ensures it doesn't get too small on phones */
        z-index: 40; 
        filter: drop-shadow(2px 2px 0px #000);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* --- MODULAR PRICE GRID --- */
    .comm-grid { 
        display: grid; 
        /* FIX: This makes it 2 columns on desktop, 1 column on phones automatically */
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
        gap: 20px; 
    }
    
    .tier-box { background: #111; border: 2px solid var(--hot-pink, #ff007f); border-radius: var(--inner-radius, 12px); padding: 12px; text-align: center; transition: 0.3s; }
    .tier-box:hover { box-shadow: 0 0 15px var(--hot-pink, #ff007f); transform: translateY(-5px); }
    .tier-box img { width: 100%; border: 1px solid #333; border-radius: 8px; margin-bottom: 10px; }

    /* --- ART PROGRESS --- */
    .workbench { background: #000; border: 2px dashed var(--hot-pink, #ff007f); border-radius: var(--inner-radius, 12px); padding: 15px; margin-top: 25px; }
    .progress-container { background: #222; border: 1px solid var(--hot-pink, #ff007f); height: 28px; border-radius: 50px; margin-top: 10px; overflow: hidden; }
    .progress-fill { background: linear-gradient(to right, #660066, var(--hot-pink, #ff007f)); height: 100%; }

</style>

<div class="top-art-banner">
    <img src="/images/kittybar.gif" class="kitty-bar-overlay kitty-bar-top" alt="Animated Kitty Border Top">
    <img src="/images/Image02.jpg" alt="Art Banner" style="width: 100%; display: block;"> <img src="/images/kittybar.gif" class="kitty-bar-overlay kitty-bar-bottom" alt="Animated Kitty Border Bottom">
</div>

<a href="/prices" class="layered-sticker-block">
    <div class="layered-image-container">
        <img src="/images/label01.png" class="layered-label" alt="Label Background">
        <img src="/images/welcome.gif" class="layered-welcome" alt="Welcome">
        <img src="/images/welcomechabby.jpg" class="layered-base-img" alt="Commission info + examples">
        <img src="/images/enter.gif" class="layered-enter" alt="Enter">
    </div>
</a>

<div class="comm-grid">
    <div class="tier-box">
        <div style="font-weight: bold; margin-bottom: 8px; color: var(--hot-pink, #ff007f);">COLOR SKETCH</div>
        <img src="/images/Image03.jpg" alt="Color Sketch Example">
        <div style="font-weight: bold; color: var(--neon-yellow, #eaff00);">$35.00</div>
    </div>
    <div class="tier-box">
        <div style="font-weight: bold; margin-bottom: 8px; color: var(--hot-pink, #ff007f);">FULL RENDER</div>
        <img src="/images/Image06.jpg" alt="Full Render Example">
        <div style="font-weight: bold; color: var(--neon-yellow, #eaff00);">$85.00</div>
    </div>
</div>

<div class="workbench">
    <div style="font-weight: bold; color: var(--hot-pink, #ff007f);">ART PROGRESS:</div>
    <p style="font-size: 0.8rem; color: #ccc;">Current Project: Illustration for @GalileoCat</p>
    <div class="progress-container">
        <div class="progress-fill" style="width: 75%;"></div>
    </div>
</div>

{{ end }}
